name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No broken symlinks
        run: |
          broken=$(find . -not -path './.git/*' -xtype l)
          if [ -n "$broken" ]; then
            echo "Broken symlinks found:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks."

      - name: .nojekyll present
        run: |
          if [ ! -f .nojekyll ]; then
            echo "Missing .nojekyll — GitHub Pages will run Jekyll and may fail."
            exit 1
          fi

      - name: Version consistency (index.html vs sw.js)
        run: |
          app_ver=$(grep -oP 'Version \K[\d]{4}-[\d]{2}-[\d]{2}\.\d+' index.html | head -1)
          sw_ver=$(grep -oP "CACHE_NAME\s*=\s*'macro-tracker-\K[^']+" sw.js | head -1)
          echo "index.html version : $app_ver"
          echo "sw.js CACHE_NAME   : $sw_ver"
          if [ "$app_ver" != "$sw_ver" ]; then
            echo "Version mismatch — index.html and sw.js must match."
            exit 1
          fi
          echo "Versions match."

      - name: No conflict markers in source files
        run: |
          matches=$(grep -rl '<<<<<<< \|>>>>>>> \|=======$' --include='*.html' --include='*.js' --include='*.json' . 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "Unresolved conflict markers found in:"
            echo "$matches"
            exit 1
          fi
          echo "No conflict markers."
