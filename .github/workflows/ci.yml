name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: HTML / JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for syntax errors (Node.js parse)
        run: |
          # Extract inline script from index.html and check for JS parse errors
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const match = html.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);
            if (!match) { console.error('Could not extract script'); process.exit(1); }
            try {
              new Function(match[1]);
              console.log('JS syntax OK');
            } catch(e) {
              console.error('JS syntax error:', e.message);
              process.exit(1);
            }
          "

      - name: Check required files exist
        run: |
          for f in index.html sw.js manifest.json CNAME 404.html LICENSE; do
            [ -f "$f" ] && echo "✓ $f" || { echo "✗ $f missing"; exit 1; }
          done

      - name: Check version consistency
        run: |
          HTML_VER=$(grep -oP 'Version \K[0-9-]+\.[0-9]+' index.html | head -1)
          SW_VER=$(grep -oP "APP_VERSION = '\K[0-9-]+\.[0-9]+" sw.js | head -1)
          CACHE_VER=$(grep -oP "CACHE_NAME = 'macro-tracker-\K[0-9-]+\.[0-9]+" sw.js | head -1)
          echo "HTML: $HTML_VER  SW APP_VERSION: $SW_VER  SW CACHE_NAME: $CACHE_VER"
          [ "$HTML_VER" = "$SW_VER" ] || { echo "Version mismatch: index.html ($HTML_VER) vs sw.js APP_VERSION ($SW_VER)"; exit 1; }
          [ "$SW_VER" = "$CACHE_VER" ] || { echo "Version mismatch: sw.js APP_VERSION ($SW_VER) vs CACHE_NAME ($CACHE_VER)"; exit 1; }
          echo "Versions consistent ✓"

      - name: Check manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Check sw.js is valid JS
        run: node --check sw.js && echo "sw.js syntax OK"

  deploy-check:
    name: GitHub Pages deploy check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Verify CNAME
        run: |
          DOMAIN=$(cat CNAME)
          echo "Custom domain: $DOMAIN"
          [ -n "$DOMAIN" ] || { echo "CNAME is empty"; exit 1; }
