name: Smoke tests

on:
  pull_request:
  push:
    branches: [master, beta]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app has no package.json; install the test runner without creating one.
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests (Chromium + WebKit)
        env:
          MT_BROWSERS: chromium,webkit
        run: npx playwright test -c tests/playwright.config.js

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
